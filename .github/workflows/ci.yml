# The gate, as CI runs it: the steps `node scripts/gate.mjs` runs locally, split into jobs that run
# side by side. `checks` holds the build and the repository checks, `tests` splits the unit suite
# across three runners, and `browser` runs the browser suite one browser to a runner, in the
# Playwright image, whose browsers and system libraries are already installed. Each browser runner
# drives the consumer the clean room installs; the Chromium runner runs the whole clean room and
# keeps that candidate with the run as the `quickcharts-candidate` artifact, and the gate holds
# every browser runner's candidate to its SHA-256. Release-record-only edits run metadata,
# documentation and source-history checks. The required `gate` verifies that every job its scope
# required passed and every other job was skipped.
#
# A release verifies the accepted artifact from successful main CI, so a tag
# push does not run this workflow again.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - name: Verify release automation decisions
        run: node --test scripts/test/ci-scope.test.mjs scripts/test/release-proof.test.mjs
      - id: scope
        run: node scripts/ci-scope.mjs

  records:
    needs: scope
    if: needs.scope.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - name: Source and history supply-chain scan
        run: |
          node --input-type=module -e 'import { check } from "./scripts/check-supply-chain.mjs"; const result = check(process.cwd(), { packed: () => [] }); if (result.hits.length) { console.error(result.hits); process.exit(1) } console.log("Source and history supply-chain checks passed; package bytes are unchanged")'
      - name: Documents
        run: node scripts/check-docs.mjs
      - name: Release records
        run: node scripts/check-release-records.mjs

  checks:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The supply-chain scan walks every line ever added to this repository, so this checkout is a
      # full one; a shallow checkout would hide history from the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm to the release toolchain
        run: npm install --global npm@12.1.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (its last step packs the candidate)
        run: pnpm run build
      - name: typecheck
        run: pnpm run typecheck
      - name: candidate pin
        run: node scripts/check-candidate-pin.mjs
      - name: supply chain, history walk included
        run: node scripts/check-supply-chain.mjs
      - name: notices
        run: node scripts/build-third-party-notices.mjs --check
      - name: documents
        run: node scripts/check-docs.mjs
      - name: release records
        run: node scripts/check-release-records.mjs

  tests:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm to the release toolchain
        run: npm install --global npm@12.1.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (its last step packs the candidate)
        run: pnpm run build
      - name: tests, shard ${{ matrix.shard }} of 3
        run: pnpm run test --shard=${{ matrix.shard }}/3

  browser:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # The image's tag matches the pinned @playwright/test, so its browsers are the ones the suite
    # expects. The runner's own user id keeps Firefox from refusing a home directory it does not own.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    # Each runner reports its candidate's SHA-256 under its own browser's name, for the gate to compare.
    outputs:
      chromium: ${{ steps.candidate.outputs.chromium }}
      firefox: ${{ steps.candidate.outputs.firefox }}
      webkit: ${{ steps.candidate.outputs.webkit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm to the release toolchain
        run: npm install --global npm@12.1.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (its last step packs the candidate)
        run: pnpm run build
      # The whole clean room runs once, on the Chromium runner; the others install the same candidate
      # into the browser consumer alone.
      - name: clean room
        if: matrix.browser == 'chromium'
        run: node clean-room/run.mjs
      - name: browser consumer
        if: matrix.browser != 'chromium'
        run: node clean-room/run.mjs --browser
      - name: browser conformance in ${{ matrix.browser }}
        run: pnpm run test:browser --project=${{ matrix.browser }}
      # The tarball the clean room installed and the browser suite drove, kept with its manifest, so
      # a release candidate is the tested file itself rather than a build of its own.
      - name: candidate the clean room installed
        id: candidate
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          tested=$(sha256sum clean-room/.artifacts/quickcharts.tgz | cut -d ' ' -f 1)
          packed=$(sha256sum .candidate/trdrs-quickcharts-*.tgz | cut -d ' ' -f 1)
          echo "candidate sha256 $packed"
          test "$tested" = "$packed"
          echo "$BROWSER=$packed" >> "$GITHUB_OUTPUT"
      - if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickcharts-candidate
          path: |
            .candidate/trdrs-quickcharts-*.tgz
            .candidate/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  gate:
    if: always()
    needs: [scope, records, checks, tests, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          RECORDS: ${{ needs.records.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
          CHROMIUM: ${{ needs.browser.outputs.chromium }}
          FIREFOX: ${{ needs.browser.outputs.firefox }}
          WEBKIT: ${{ needs.browser.outputs.webkit }}
        run: |
          test "$SCOPE" = success
          case "$FULL" in
            true)
              test "$RECORDS" = skipped; test "$CHECKS" = success; test "$TESTS" = success; test "$BROWSER" = success
              # Every browser drove the candidate the Chromium runner keeps.
              echo "candidate sha256 chromium $CHROMIUM, firefox $FIREFOX, webkit $WEBKIT"
              test -n "$CHROMIUM"; test "$FIREFOX" = "$CHROMIUM"; test "$WEBKIT" = "$CHROMIUM" ;;
            false) test "$RECORDS" = success; test "$CHECKS" = skipped; test "$TESTS" = skipped; test "$BROWSER" = skipped ;;
            *) exit 1 ;;
          esac
