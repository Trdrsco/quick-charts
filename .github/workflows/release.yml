# The release: one tagged commit on `main`, published by this workflow through the registry's
# trusted publishing with provenance. No token that can publish exists on a workstation or in a
# workflow secret.
#
# The workflow is inert until the repository variable PUBLICATION_APPROVED is set to the string
# `yes`. That variable does not exist, and only the owner creates it, so a tag pushed before the
# owner's publication instruction runs the checks and stops before the publish.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing mints the provenance token for the publish step.
      id-token: write
    timeout-minutes: 45
    steps:
      - name: the owner's publication instruction
        if: vars.PUBLICATION_APPROVED != 'yes'
        run: |
          echo "The repository variable PUBLICATION_APPROVED is not set to 'yes'."
          echo "Publication waits on the owner's instruction; nothing is published by this run."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The registry's trusted-publishing exchange lives in the npm CLI, which asks for 11.5.1 or
      # later on Node 22.14.0 or later. The npm bundled inside Node 22 is older than that, and a
      # publish through it would look for a token this workflow deliberately does not hold.
      - name: the npm that speaks trusted publishing
        run: |
          npm install --global npm@latest
          npm --version

      - name: install
        run: pnpm install --frozen-lockfile

      - name: the whole rehearsal, which runs the gate and publishes nothing
        run: node scripts/release-rehearsal.mjs

      - name: the tag names the version in the manifest
        run: |
          version=$(node -p "require('./package.json').version")
          test "refs/tags/v$version" = "$GITHUB_REF"

      - name: publish
        run: npm publish --provenance --access public
