name: release

on:
  workflow_dispatch:
    inputs:
      artifact_sha256:
        description: SHA-256 of the candidate accepted by the first host
        required: true
        type: string
      first_host_evidence:
        description: HTTPS link to the accepted first-host check record for this candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Pin npm
        run: npm install --global npm@12.1.0
      - name: Verify release identity
        env:
          EXPECTED_DIGEST: ${{ inputs.artifact_sha256 }}
          FIRST_HOST_EVIDENCE: ${{ inputs.first_host_evidence }}
        run: |
          node scripts/release-policy.mjs identity
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install browser test engines
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Rehearse the exact candidate
        run: node scripts/release-rehearsal.mjs
      - name: Bind tested bytes to first-host acceptance
        id: candidate
        env:
          EXPECTED_DIGEST: ${{ inputs.artifact_sha256 }}
          FIRST_HOST_EVIDENCE: ${{ inputs.first_host_evidence }}
        run: node scripts/release-policy.mjs artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickcharts-release
          path: .candidate/trdrs-quickcharts-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@12.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quickcharts-release
          path: artifact
      - name: Verify and publish the approved tarball
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.digest }}
        run: |
          shopt -s nullglob
          files=(artifact/trdrs-quickcharts-*.tgz)
          test "${#files[@]}" -eq 1
          printf '%s  %s\n' "$EXPECTED_DIGEST" "${files[0]}" | sha256sum --check --strict
          npm publish "${files[0]}" --ignore-scripts --provenance --access public
